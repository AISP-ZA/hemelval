brief: "South-Africa-first wine app — scan, rate, build a palate, discover Western Cape estates. Vivino competitor focused on SA wines, winemakers, and wine-route culture."
summary_executive: "Decanta connects South African wine lovers with Western Cape wine farms. Snap a bottle, log your tasting, and the app learns your palate and recommends wines you'll love. Two-sided: consumer (free + Pro) and estate (verified B2B SaaS)."
summary_technical: "Expo + React Native (iOS + Android, one JS/TS codebase). Supabase (Postgres + Auth + Storage + RLS) as sole backend. Shared tasting-engine package (WSET/Noble-Wheel controlled vocabularies + scoring). Next.js merchant admin for estates. EAS Build for App Store + Play Store binaries."
summary_project: "Building. Research complete (Vivino, SA wine industry, tasting taxonomy, festivals). Stack: Expo RN + Supabase. Brand: Decanta. Monetization: Consumer Pro (R89/mo) + Estate SaaS (R499-1499/mo); marketplace deferred to Phase 2."
tech: [Expo, React-Native, TypeScript, Supabase, Next.js]

